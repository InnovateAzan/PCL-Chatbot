<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OneAssist Admin</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="admin-shell">
      <header class="admin-header">
        <div>
          <h1>OneAssist Admin</h1>
          <p>Usage, feedback, and unanswered question review</p>
        </div>
      </header>

      <section id="kpiGrid" class="admin-kpi-grid"></section>

      <section class="admin-grid">
        <article>
          <h2>Daily Usage</h2>
          <div id="usageList" class="admin-list"></div>
        </article>
        <article>
          <h2>Top Questions</h2>
          <div id="topQuestionsList" class="admin-list"></div>
        </article>
        <article>
          <h2>Top Policies</h2>
          <div id="topPoliciesList" class="admin-list"></div>
        </article>
        <article>
          <h2>Unanswered Topics</h2>
          <div id="topicsList" class="admin-list"></div>
        </article>
      </section>

      <section class="admin-table-section">
        <h2>Unanswered Questions</h2>
        <div id="unansweredTable"></div>
      </section>
    </main>

    <script src="./admin.js"></script>
  </body>
</html>
